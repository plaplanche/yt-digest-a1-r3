[project]
base_branch = "main"
env = [
  "WORKER_PORT", "MOCKS_PORT", "WORKER_URL", "MOCKS_URL", "STACK_READY_TIMEOUT", "OPS_TOKEN",
  "LEASE_SECONDS", "ACCESS_TOKEN_TTL_SECONDS", "REFRESH_TOKEN_TTL_SECONDS", "AUTH_CODE_TTL_SECONDS",
  "AUTH_REQUEST_TTL_SECONDS", "GOOGLE_ISSUER", "GOOGLE_CLIENT_ID", "GOOGLE_CLIENT_SECRET",
  "ADMIN_EMAIL", "TOKEN_ENC_KEY", "ALLOWED_ORIGINS", "WRANGLER_SEND_METRICS",
]

[tracker]
kind = "github"
repository = "plaplanche/yt-digest-a1-r3"
token_env = "GH_TOKEN"
ready_label = "ariane"

[agents.implementer]
runtime = "claude-code"
model = "claude-sonnet-5-5"
tools = ["Read", "Edit", "Write", "Glob", "Grep", "Bash"]
max_budget_usd = 8.0
timeout_minutes = 60

[agents.reviewer]
runtime = "claude-code"
model = "claude-opus-5-5"
tools = ["Read", "Glob", "Grep"]
max_budget_usd = 3.0
timeout_minutes = 20

# Selective checks (Ariane ADR 0056): each check runs only when the round changes one of its
# paths; lint always runs. The other settings are as in the rerun of 18 October.
[[checks]]
name = "lint"
command = ["./scripts/check.sh", "lint"]

[[checks]]
name = "contracts"
command = ["./scripts/check.sh", "contracts"]
paths = ["contracts/**", "worker/**", "node/**", "scripts/**"]

[[checks]]
name = "test-node"
command = ["./scripts/check.sh", "test-node"]
paths = ["node/**", "contracts/**", "scripts/**"]

[[checks]]
name = "test-worker"
command = ["./scripts/check.sh", "test-worker"]
paths = ["worker/**", "contracts/**", "scripts/**"]

[[checks]]
name = "e2e"
command = ["./scripts/check.sh", "e2e"]
paths = ["e2e/**", "worker/**", "node/**", "contracts/**", "scripts/**", "ci/**"]

[definition_of_done]
items = [
  { check = "lint" },
  { check = "contracts" },
  { check = "test-node" },
  { check = "test-worker" },
  { check = "e2e" },
  { text = "The change does what the ticket and spec/lot-2.md (and spec/lot-1.md, which still applies) say, and nothing more." },
  { text = "The change is covered by tests that fail without it." },
  { text = "Every choice the spec leaves open is written down in docs/decisions.md." },
]
